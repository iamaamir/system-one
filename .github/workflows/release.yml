# Release via npm trusted publishing (OIDC). No tokens.
#
# ONE-TIME SETUP on npmjs.com, per package (system-one-core, pi-system-one):
#   Settings -> Trusted publishing -> Add GitHub Actions publisher with
#     user iamaamir, repo system-one, workflow filename release.yml,
#   and allow direct `npm publish` (not stage-only).
# Afterwards (recommended): Settings -> Publishing access ->
#   "Require two-factor authentication and disallow tokens",
#   then revoke old automation tokens.
# NOTE: repository.url in each package.json must match this repo.
#
# Usage: push a tag like system-one-core@0.1.2 or pi-system-one@1.2.0.
# The tag version must match the package.json version.
# Provenance attestations are generated automatically (public repo).
name: Release
on:
  push:
    tags: ["system-one-core@*", "pi-system-one@*"]
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run build --workspace system-one-core
      - run: npm run typecheck
      - run: npm run lint
      - id: pkg
        run: |
          TAG="${GITHUB_REF_NAME%@*}"
          echo "name=$TAG" >> "$GITHUB_OUTPUT"
          test "$(node -p "require('./$TAG/package.json').version")" = "${GITHUB_REF_NAME#*@}" \
            || { echo "tag/version mismatch"; exit 1; }
      - run: npm test --workspace "${{ steps.pkg.outputs.name }}"
      - run: npm publish --workspace "${{ steps.pkg.outputs.name }}" --access public
